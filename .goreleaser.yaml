# GoReleaser configuration for the MailBust CLI.
# Docs: https://goreleaser.com  |  validate locally with: goreleaser check
version: 2

project_name: mailbust

builds:
  - id: mailbust
    dir: cli # the CLI is its own Go module in ./cli
    main: .
    binary: mailbust
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [mailbust]
    name_template: "mailbust_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# --- Package managers --------------------------------------------------------
